<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Nexora</title>
<!-- Inlogscherm voor een versleutelde pagina (Nexora Studio of de preview van de website).
     Gegenereerd door deploy/bibliotheek/versleutel.mjs. De bibliotheek zelf staat versleuteld in deze pagina
     (AES-256-GCM, sleutel via PBKDF2-SHA256) en wordt pas in de browser ontsleuteld met het wachtwoord. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Sans:wght@600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Alles hangt onder .slotscherm: na het inloggen vervangt de bibliotheek deze pagina, en geen van
   deze regels mag dan nog op html, body of de elementen van de bibliotheek werken. */
.slotscherm, .slotscherm * { box-sizing: border-box; }
.slotscherm {
  --navy: #060B19; --kaart: rgba(10, 17, 34, .82); --inkt: #FFFFFF; --tekst: #C4CFE0; --grijs: #8A98B3;
  --lijn: rgba(148, 170, 214, .18); --lijn-sterk: rgba(148, 170, 214, .32); --blauw: #3D7BFF; --fout: #FCA5A5;
  position: fixed; inset: 0; overflow-y: auto; color: var(--tekst); color-scheme: dark;
  font: 15px/1.55 "Inter", ui-sans-serif, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
  display: grid; place-items: center;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background:
    radial-gradient(40rem 26rem at 10% -10%, rgba(42, 92, 245, .20), transparent 70%),
    var(--navy);
}
.slotscherm::before { content: ""; position: fixed; inset: 0; pointer-events: none;
  background-image: linear-gradient(to right, rgba(148, 170, 214, .07) 1px, transparent 1px), linear-gradient(to bottom, rgba(148, 170, 214, .07) 1px, transparent 1px);
  background-size: 40px 40px;
  -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 100%); }
.slotscherm .slot { position: relative; width: 100%; max-width: 380px; display: grid; gap: 18px; }
.slotscherm .merk { display: flex; gap: 10px; align-items: center; }
.slotscherm .intern { font: 600 .62rem/1 "JetBrains Mono", ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase; color: #FCD34D;
  border: 1px solid rgba(252, 211, 77, .4); background: rgba(252, 211, 77, .08); padding: 4px 7px; border-radius: 5px; margin-left: auto; }
.slotscherm .merk svg { width: 34px; height: 34px; flex: none; }
.slotscherm .merk b { display: block; font: 600 1.1rem/1.1 "Instrument Sans", "Inter", system-ui, sans-serif; color: var(--inkt); letter-spacing: -.02em; }
.slotscherm .merk small { display: block; font: 500 .72rem/1.4 "JetBrains Mono", ui-monospace, monospace; color: var(--grijs); margin-top: 3px; }
.slotscherm h1 { font: 600 1.05rem/1.3 "Instrument Sans", "Inter", system-ui, sans-serif; margin: 0; letter-spacing: -.01em; color: var(--inkt); }
.slotscherm .kop { display: grid; gap: 2px; }
.slotscherm .kop p { margin: 0; color: var(--grijs); font-size: .82rem; }
.slotscherm form { background: var(--kaart); border: 1px solid var(--lijn); border-radius: 12px; padding: 20px; display: grid; gap: 12px;
  box-shadow: 0 24px 60px -30px rgba(0, 0, 0, .8); }
.slotscherm label { font-weight: 600; font-size: .88rem; color: var(--inkt); }
.slotscherm input[type="password"] { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--lijn-sterk); background: rgba(255, 255, 255, .04); color: var(--inkt); font: inherit; }
.slotscherm input[type="password"]:focus { outline: none; border-color: var(--blauw); box-shadow: 0 0 0 3px rgba(61, 123, 255, .25); }
.slotscherm .onthoud { display: flex; gap: 8px; align-items: center; font-weight: 400; color: var(--tekst); font-size: .86rem; cursor: pointer; }
.slotscherm .onthoud input { accent-color: var(--blauw); width: 16px; height: 16px; }
.slotscherm button { border: 0; border-radius: 8px; padding: 10px 16px; color: #fff; cursor: pointer; display: inline-flex; justify-content: center; align-items: center; gap: 8px;
  background: linear-gradient(115deg, #2A5CF5 0%, #5B47F5 100%); font: 600 .95rem "Inter", system-ui, sans-serif;
  box-shadow: 0 10px 26px -12px rgba(42, 92, 245, .9), inset 0 1px 0 rgba(255, 255, 255, .14); transition: transform .15s, box-shadow .15s; }
.slotscherm button:hover { filter: brightness(1.08); }
.slotscherm button svg { width: 16px; height: 16px; }
.slotscherm button:disabled { opacity: .6; cursor: default; transform: none; }
.slotscherm button:focus-visible { outline: 2px solid #7FB0FF; outline-offset: 2px; }
.slotscherm .fout { color: var(--fout); font-size: .86rem; min-height: 1.3em; margin: 0; }
.slotscherm .voet { color: var(--grijs); font-size: .78rem; text-align: center; margin: 0; }
</style>
</head>

<div class="slotscherm">
<main class="slot">
  <div class="merk">
    <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="slot-logo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4B86FF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs><rect x="1" y="1" width="30" height="30" rx="9" fill="#0B1426" stroke="rgba(148,170,214,0.25)"/><path d="M10 22V10l12 12V10" fill="none" stroke="url(#slot-logo)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.1" fill="#4B86FF"/><circle cx="22" cy="22" r="2.1" fill="#22D3EE"/></svg>
    <div><b>Nexora</b><small>Website in ontwikkeling</small></div>
    <span class="intern">Preview</span>
  </div>
  <form id="formulier" autocomplete="on">
  <div class="kop">
    <h1>Inloggen</h1>
    <p>Deze website is nog niet openbaar. Log in met het wachtwoord dat je van Nexora kreeg.</p>
  </div>
    <label for="wachtwoord">Wachtwoord</label>
    <input type="password" id="wachtwoord" name="password" autocomplete="current-password" required autofocus>
    <label class="onthoud"><input type="checkbox" id="onthoud"> Onthoud op dit apparaat</label>
    <button type="submit" id="openen">Openen</button>
    <p class="fout" id="fout" role="alert"></p>
  </form>
  <p class="voet">Versie van 16 oktober 2026. Wachtwoord kwijt? Vraag het aan een collega.</p>
</main>
</div>

const OPSLAG = 'nexora.sleutel.Stephanspa/nexorawebsite';
// De sleutel staat altijd in sessionStorage (doorklikken naar andere pagina's in dit tabblad zonder
// opnieuw inloggen) en met 'Onthoud op dit apparaat' ook in localStorage.
const bewaar = (waarde, ook_onthouden) => {
  try { sessionStorage.setItem(OPSLAG, waarde); } catch {}
  if (ook_onthouden) { try { localStorage.setItem(OPSLAG, waarde); } catch {} }
};
const vergeet = () => {
  try { sessionStorage.removeItem(OPSLAG); } catch {}
  try { localStorage.removeItem(OPSLAG); } catch {}
};
const lees = () => {
  for (const opslag of [sessionStorage, localStorage]) {
    try { const w = opslag.getItem(OPSLAG); if (w) return w; } catch {}
  }
  return null;
};
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const naarB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));

async function sleutelUitWachtwoord(wachtwoord) {
  const basis = await crypto.subtle.importKey('raw', new TextEncoder().encode(wachtwoord), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', hash: 'SHA-256', salt: b64(KLUIS.zout), iterations: KLUIS.iteraties },
    basis, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}

async function open(sleutel) {
  await toon(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(KLUIS.iv) }, sleutel, b64(KLUIS.data)));
}

async function toon(platte) {
  const html = new TextDecoder().decode(platte);
  // Pas vervangen als deze pagina helemaal geladen is; anders kan de browser stukken van het inlogscherm laten staan.
  if (document.readyState !== 'complete') await new Promise((klaar) => window.addEventListener('load', klaar, { once: true }));
  // Vervang deze pagina door de bibliotheek; het adres (en #onderdeel) blijft gelijk.
  document.open();
  document.write(html);
  document.close();
}

async function probeerOnthouden() {
  // Adres eindigend op #vergeet: dit apparaat vergeet de sleutel en toont het inlogscherm.
  if (location.hash === '#vergeet') {
    vergeet();
    history.replaceState(null, '', location.pathname + location.search);
    return;
  }
  try {
    const opgeslagen = JSON.parse(lees() || 'null');
    if (!opgeslagen || opgeslagen.zout !== KLUIS.zout) return;
    const sleutel = await crypto.subtle.importKey('raw', b64(opgeslagen.sleutel), 'AES-GCM', false, ['decrypt']);
    await open(sleutel);
  } catch {
    vergeet();
  }
}

document.getElementById('formulier').addEventListener('submit', async (e) => {
  e.preventDefault();
  const knop = document.getElementById('openen');
  const fout = document.getElementById('fout');
  knop.disabled = true;
  knop.textContent = 'Bezig met openen…';
  fout.textContent = '';
  try {
    const sleutel = await sleutelUitWachtwoord(document.getElementById('wachtwoord').value);
    const platte = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(KLUIS.iv) }, sleutel, b64(KLUIS.data));
    bewaar(JSON.stringify({ zout: KLUIS.zout, sleutel: naarB64(await crypto.subtle.exportKey('raw', sleutel)) }),
      document.getElementById('onthoud').checked);
    await toon(platte);
  } catch {
    fout.textContent = 'Dit wachtwoord klopt niet.';
    knop.disabled = false;
    knop.textContent = 'Openen';
  }
});

if (!window.crypto?.subtle) {
  document.getElementById('fout').textContent = 'Deze browser kan deze pagina niet openen (geen beveiligde verbinding).';
} else {
  probeerOnthouden();
}
})();
